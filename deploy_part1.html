<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="DADEREZO — Guide d'installation et d'utilisation de la plateforme SaaS multi-agents de supervision et de pilotage réseau.">
<title>DADEREZO — Installation & Utilisation</title>
<style>
:root{
  --bg:#020b22; --bg-soft:#061538; --card:rgba(8,22,56,.88); --card-solid:#081840;
  --well:rgba(2,10,30,.76); --nav-bg:rgba(3,11,34,.86);
  --ink:#f1f6ff; --ink-dim:#cbdcff; --muted:#8ba5cf;
  --brand:#0077ff; --brand-ink:#7cc4ff; --brand-soft:rgba(0,119,255,.18);
  --emerald:#10b981; --emerald-ink:#6ee7b7; --emerald-soft:rgba(16,185,129,.15);
  --cyan:#00b8ff; --cyan-ink:#6be0ff; --cyan-soft:rgba(0,184,255,.16);
  --amber:#f59e0b; --amber-ink:#fcd34d; --amber-soft:rgba(245,158,11,.15);
  --red:#ef4444; --red-ink:#fca5a5; --red-soft:rgba(239,68,68,.15);
  --mono:"JetBrains Mono","Cascadia Code","Fira Code",Consolas,monospace;
  --sans:"Space Grotesk","Inter","Segoe UI Variable",Segoe UI,system-ui,sans-serif;
  color-scheme:dark;
}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.6 var(--sans); background:
    radial-gradient(960px 500px at 14% -6%,rgba(0,119,255,.12),transparent 62%),
    radial-gradient(880px 460px at 88% -4%,rgba(0,184,255,.10),transparent 60%),
    linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px),var(--bg);
  background-size:auto,auto,38px 38px,38px 38px,auto; overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
code,.mono{font-family:var(--mono);font-size:12.5px}
.container{max-width:1200px;margin:0 auto;padding:0 clamp(18px,4vw,36px)}
.hidden{display:none!important}

/* Header */
header.site-nav{position:sticky;top:0;z-index:50;background:var(--nav-bg);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nav-inner{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 0}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--brand-soft);border:1px solid var(--brand);display:flex;align-items:center;justify-content:center}
.brand-name{font-weight:700;font-size:16px;letter-spacing:.5px}
.brand-tag{font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}

/* Hero */
.hero{padding:48px 0 32px;position:relative}
.hero-title{font-size:clamp(28px,4vw,42px);line-height:1.15;margin:0 0 12px;letter-spacing:-.5px}
.hero-sub{font-size:16px;color:var(--muted);max-width:720px;line-height:1.7}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;border:none;transition:all .2s}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:#0066eb}
.btn-secondary{background:var(--card);color:var(--ink);border:1px solid var(--line-strong)}
.btn-secondary:hover{background:var(--bg-soft)}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--ink);background:rgba(255,255,255,.05)}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:8px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
.badge-new{background:var(--emerald-soft);color:var(--emerald-ink)}
.badge-dev{background:var(--brand-soft);color:var(--brand-ink)}
.badge-api{background:var(--cyan-soft);color:var(--cyan-ink)}
.badge-demo{background:var(--amber-soft);color:var(--amber-ink)}

/* Section */
section.section{padding:40px 0}
.section-title{font-size:26px;margin:0 0 6px;letter-spacing:-.3px}
.section-desc{color:var(--muted);max-width:820px;margin-bottom:22px}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:900px){.grid-2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;transition:background .2s}
.card:hover{background:rgba(8,22,56,.92)}
.card h3{font-size:16px;margin:0 0 8px}
.card p{color:var(--muted);font-size:14px;line-height:1.6}
.card .tag{display:inline-block;margin-top:8px;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600}

/* Code */
.code-block{position:relative;background:#0a1a3a;border:1px solid var(--line);border-radius:12px;overflow:auto;padding:16px 18px;max-height:420px;overflow-y:auto}
.code-block code{color:#e2ecff;line-height:1.6;font-size:13px}
.code-block .gutter{width:36px;user-select:none;color:var(--muted);text-align:right;padding:8px 4px;font-size:11px}
.copy-btn{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.08);border:none;border-radius:6px;padding:4px 8px;color:var(--muted);font-size:11px;cursor:pointer}
.copy-btn:hover{background:rgba(255,255,255,.15);color:var(--ink)}

/* Architecture */
.arch-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.pipe-node{background:rgba(0,119,255,.08);border:1px solid rgba(0,119,255,.3);border-radius:10px;padding:12px;text-align:center}
.pipe-node-head{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.pipe-node .agent-name{font-size:17px;font-weight:700;color:var(--brand-ink);margin:4px 0}
.pipe-node .agent-role{font-size:12px;color:var(--muted);line-height:1.5}

/* Steps */
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.step-num{flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.step-body{flex:1}
.step-body h4{margin:0 0 4px;font-size:15px}
.step-body p{color:var(--muted);font-size:13.5px}
.step-body code{background:rgba(0,119,255,.12);padding:2px 6px;border-radius:4px;font-size:12.5px}

/* API endpoints table */
.api-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.api-table th{background:rgba(0,119,255,.12);color:var(--brand-ink);text-align:left;padding:10px 12px;font-size:12px;letter-spacing:.5px;text-transform:uppercase}
.api-table td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.api-table tr:hover td{background:rgba(255,255,255,.03))
.api-table .method{font-weight:700;padding:2px 8px;border-radius:4px;font-size:11px}
.api-table .get{background:rgba(16,185,129,.15);color:var(--emerald-ink)}
.api-table .post{background:rgba(0,119,255,.15);color:var(--brand-ink)}
.api-table .put{background:rgba(245,158,11,.15);color:var(--amber-ink)}
.api-table .delete{background:rgba(239,68,68,.15);color:var(--red-ink)}

/* Security card */
.security-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.security-item{border:1px solid var(--line);border-radius:12px;padding:16px;background:rgba(8,22,56,.6)}
.security-item .title{font-weight:700;font-size:14px;color:var(--ink-strong)}
.security-item .desc{color:var(--muted);font-size:13px;line-height:1.6}
.security-item .key{font-family:var(--mono);font-size:12px;background:rgba(0,119,255,.1);padding:2px 6px;border-radius:4px;color:var(--brand-ink)}

/* FAQ */
.faq-item{border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:10px;cursor:pointer;background:var(--card)}
.faq-item .q{font-weight:600;font-size:14.5px;color:var(--ink-strong)}
.faq-item .a{color:var(--muted);font-size:13.5px;line-height:1.7;padding-top:8px;display:none}
.faq-item.active .a{display:block}
.faq-item .arrow{color:var(--muted);font-size:14px;transition:transform .2s}

/* Install steps */
.install-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.install-step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.install-step .num{font-size:28px;font-weight:800;color:var(--brand);margin-bottom:8px}
.install-step h3{margin:0 0 6px;font-size:15.5px}
.install-step p{color:var(--muted);font-size:13.5px;line-height:1.65}

/* Troubleshooting */
.troubleshoot dt{font-weight:600;color:var(--ink-strong);margin-top:12px}
.troubleshoot dd{color:var(--muted);font-size:13.5px;line-height:1.7;margin-left:0;margin-bottom:6px}

/* Footer */
footer.site-footer{padding:32px 0;background:var(--bg-soft);border-top:1px solid var(--line)}
.footer-grid{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center}
.footer-link{font-size:13px;color:var(--muted);font-family:var(--mono)}
.footer-link:hover{color:var(--brand-ink)}

/* Scrollbar */
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:rgba(0,119,255,.4);border-radius:4px}

/* Responsive */
@media (max-width:720px){
  .hero-title{font-size:28px}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .nav-inner{flex-wrap:wrap;gap:6px}
}

/* Badge */
.hero-badge{display:inline-block;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.5px;margin-bottom:16px}
.hero-badge.primary{background:var(--brand-soft);color:var(--brand-ink)}
.hero-badge.secondary{background:var(--cyan-soft);color:var(--cyan-ink)}

/* Installation status */
.install-status{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.install-status .item{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--card)}
.install-status .item .state{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700}
.install-status .item .label{font-weight:600;color:var(--ink-strong);font-size:14px}
.install-status .item .detail{font-size:12.5px;color:var(--muted);mar
