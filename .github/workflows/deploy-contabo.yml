name: DADEREZO CI & Contabo Auto-Deploy

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  verify:
    name: Tests Unitaires & Intégration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: daderezo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d daderezo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Exécution de la suite de tests DADEREZO
        env:
          DADEREZO_AUTH_SECRET: ci-test-secret-not-for-production
          DADEREZO_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/daderezo_test
          PGPASSWORD: ci-only-test-password
        run: python -m pytest -q
      - name: Vérification DOM des parcours Google, QR 2FA et accueil
        run: |
          npm install --prefix .cache/auth-ui --no-package-lock --no-audit --no-fund jsdom@26.1.0
          for scenario in default login signup demo; do
            NODE_PATH=.cache/auth-ui/node_modules node tests/auth_ui.cjs "$scenario"
          done

  deploy-contabo:
    name: Déploiement Push vers VPS Contabo (si secrets SSH configurés)
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_CONTABO_SSH: ${{ secrets.CONTABO_HOST != '' && secrets.CONTABO_SSH_KEY != '' }}
    steps:
      - name: Vérification du mode de synchronisation Contabo
        if: env.HAS_CONTABO_SSH != 'true'
        run: |
          echo "Mode GitOps Pull actif (aucun secret SSH requis : contabo_bootstrap.sh synchronise /opt/daderezo toutes les 2 min)."
      - name: Déploiement instantané SSH vers Contabo
        if: env.HAS_CONTABO_SSH == 'true'
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
          CONTABO_USER: ${{ secrets.CONTABO_USER }}
          CONTABO_PORT: ${{ secrets.CONTABO_PORT }}
          CONTABO_SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${CONTABO_SSH_KEY}" > ~/.ssh/id_contabo
          chmod 600 ~/.ssh/id_contabo
          SSH_PORT="${CONTABO_PORT:-22}"
          SSH_USER="${CONTABO_USER:-root}"
          ssh -p "${SSH_PORT}" -i ~/.ssh/id_contabo -o StrictHostKeyChecking=accept-new "${SSH_USER}@${CONTABO_HOST}" \
            "cd /opt/daderezo && git fetch origin main && git reset --hard origin/main && docker compose -f docker-compose.contabo.yml up -d --build --remove-orphans"
