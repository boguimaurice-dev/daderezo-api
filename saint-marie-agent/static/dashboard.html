<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord — Hôtellerie Sainte-Marie</title>
    <style>
        :root {
            --bg: #f8f5f0;
            --card: #ffffff;
            --text: #3d3d3d;
            --accent: #77854b;
            --accent-dark: #5f6b3a;
            --border: #e0dbc9;
            --muted: #8a8a8a;
            --danger: #c44;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        header {
            display: flex; align-items: center; gap: 20px;
            padding: 20px 24px; background: var(--card);
            border-bottom: 1px solid var(--border); border-radius: 12px;
            margin-bottom: 24px;
        }

        header h1 { color: var(--accent); font-size: 1.4em; font-weight: 600; }
        header .subtitle { color: var(--muted); font-size: 0.9em; }

        .stats {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px; margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 16px;
        }

        .stat-card .value { font-size: 2em; font-weight: 600; color: var(--accent); }
        .stat-card .label { font-size: 0.85em; color: var(--muted); }

        .section { margin-bottom: 24px; }
        .section h2 {
            color: var(--accent); font-size: 1.1em; margin-bottom: 12px;
            padding-bottom: 8px; border-bottom: 1px solid var(--border);
        }

        .request-list {
            display: grid; gap: 12px; max-height: 400px; overflow-y: auto;
        }

        .request-item {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 8px; padding: 12px 16px;
        }

        .request-item .header { display: flex; justify-content: space-between; align-items: center; }
        .request-item .type { font-weight: 600; color: var(--accent); }
        .request-item .meta { font-size: 0.85em; color: var(--muted); margin-top: 4px; }

        .status-badge {
            padding: 2px 8px; border-radius: 12px; font-size: 0.75em;
            font-weight: 600; text-transform: uppercase;
        }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-review { background: #d1ecf1; color: #0c5460; }
        .status-accepted { background: #d4edda; color: #155724; }
        .status-rejected { background: #f8d7da; color: #721c24; }
        .status-completed { background: #e2e3e5; color: #383d41; }

        .notification-item {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 8px; padding: 12px 16px; margin-bottom: 8px;
        }

        .notification-item .subject { font-weight: 600; color: var(--accent); }
        .notification-item .body { font-size: 0.9em; color: var(--text); }
        .notification-item .timestamp { font-size: 0.8em; color: var(--muted); margin-top: 4px; }

        .log-item {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.8em; padding: 4px 8px; border-radius: 4px;
            background: var(--bg); margin-bottom: 4px;
        }
        .log-info { color: #155724; background: #d4edda; }
        .log-warning { color: #856404; background: #fff3cd; }
        .log-error { color: #721c24; background: #f8d7da; }

        .action-bar {
            display: flex; gap: 12px; margin-top: 20px;
            padding: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 8px;
        }

        button {
            padding: 10px 20px; border: none; border-radius: 6px;
            font-size: 0.9em; font-weight: 600; cursor: pointer;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-dark); }
        .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
        .btn-danger { background: var(--danger); color: white; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>✝️ Tableau de bord de l'hôtellerie</h1>
            <p class="subtitle">Monastère Bénédictin Sainte-Marie de Bouaké</p>
        </div>
    </header>

    <div class="container">
        <div class="stats">
            <div class="stat-card">
                <div class="value" id="statPending">0</div>
                <div class="label">En attente de validation</div>
            </div>
            <div class="stat-card">
                <div class="value" id="statReview">0</div>
                <div class="label">En revue</div>
            </div>
            <div class="stat-card">
                <div class="value" id="statCompleted">0</div>
                <div class="label">Validées / complétées</div>
            </div>
            <div class="stat-card">
                <div class="value" id="statNotifications">0</div>
                <div class="label">Notifications non lues</div>
            </div>
        </div>

        <div class="section">
            <h2>Demandes entrantes</h2>
            <div class="request-list" id="requestList">
                <div class="request-item">Chargement...</div>
            </div>
        </div>

        <div class="section">
            <h2>Notifications des frères</h2>
            <div id="notifList">
                <div class="notification-item">Chargement...</div>
            </div>
        </div>

        <div class="section">
            <h2>Journal des actions</h2>
            <div id="logList">
                <div class="log-item log-info">Chargement...</div>
            </div>
        </div>
    </div>

    <script>
        async function loadDashboard() {
            try {
                const res = await fetch('/api/dashboard');
                const data = await res.json();

                // Stats
                document.getElementById('statPending').textContent = data.requests.filter(r => r.status === 'pending_receiving').length;
                document.getElementById('statReview').textContent = data.requests.filter(r => r.status === 'pending_review').length;
                document.getElementById('statCompleted').textContent = data.requests.filter(r => r.status === 'completed').length;
                document.getElementById('statNotifications').textContent = data.notifications.filter(n => !n.read).length;

                // Requests
                const list = document.getElementById('requestList');
                if (data.requests.length === 0) {
                    list.innerHTML = '<div class="request-item">Aucune demande enregistrée</div>';
                } else {
                    list.innerHTML = data.requests.map(r => {
                        const statusClass = r.status || 'pending_receiving';
                        const statusLabels = {
                            'pending_receiving': 'En attente de validation',
                            'pending_review': 'En revue',
                            'accepted': 'Acceptée',
                            'rejected': 'Refusée',
                            'completed': 'Complétée'
                        };
                        return `
                            <div class="request-item">
                                <div class="header">
                                    <span class="type">${r.stay_type || '—'}</span>
                                    <span class="status-badge ${statusClass}">${statusLabels[r.status] || r.status}</span>
                                </div>
                                <div class="meta">
                                    📅 ${r.arrival} → ${r.departure} | 👥 ${r.people} personne(s) | <b>${r.host_name || '—'}</b>
                                    ${r.needs ? `<br>📋 ${r.needs}` : ''}
                                </div>
                            </div>
                        `;
                    }).join('');
                }

                // Notifications
                const notifList = document.getElementById('notifList');
                if (data.notifications.length === 0) {
                    notifList.innerHTML = '<div class="notification-item">Aucune notification</div>';
                } else {
                    notifList.innerHTML = data.notifications.map(n => `
                        <div class="notification-item">
                            <div class="subject">📩 ${n.subject}</div>
                            <div class="body">${n.body}</div>
                            <div class="timestamp">${n.sent_at} ${n.read ? '(lue)' : '(non lue)'}</div>
                        </div>
                    `).join('');
                }

                // Log
                const logList = document.getElementById('logList');
                if (data.log.length === 0) {
                    logList.innerHTML = '<div class="log-item">Aucune entrée</div>';
                } else {
                    logList.innerHTML = data.log.map(l => {
                        const cls = `log-${l.level}`;
                        return `<div class="log-item ${cls}">${l.ts} — ${l.message}</div>`;
                    }).join('');
                }
            } catch (err) {
                document.getElementById('requestList').innerHTML = '<div class="request-item">Erreur de connexion au serveur</div>';
            }
        }

        setInterval(loadDashboard, 10000);
        loadDashboard();
    </script>
</body>
</html>
